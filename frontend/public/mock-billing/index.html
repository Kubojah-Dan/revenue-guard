<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revenue Guard — Billing Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', ui-sans-serif, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      max-width: 540px;
      width: 100%;
      padding: 0;
      overflow: hidden;
    }
    .header {
      background: #0a0a0a;
      color: #ffffff;
      padding: 28px 32px;
    }
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      margin-bottom: 16px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
    }
    .header h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header p {
      margin: 0;
      font-size: 13px;
      color: rgba(255,255,255,0.55);
    }
    .body { padding: 28px 32px; }
    .receipt-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
      gap: 16px;
    }
    .receipt-row:last-child { border-bottom: none; }
    .label {
      color: #8a8a8a;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 600;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .value {
      color: #1a1a1a;
      font-weight: 500;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .value.accent {
      color: #6d5bd0;
      font-weight: 700;
      font-size: 15px;
    }
    .value code {
      background: #f5f5f5;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      padding: 2px 8px;
      font-family: ui-monospace, 'Courier New', monospace;
      font-size: 12px;
      color: #1a1a1a;
    }
    .footer {
      background: #f5f5f5;
      border-top: 1px solid #e5e5e5;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer p {
      margin: 0;
      font-size: 11px;
      color: #8a8a8a;
    }
    .back-btn {
      background: transparent;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      color: #1a1a1a;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 150ms ease;
    }
    .back-btn:hover { background: #f0f0f0; }
    .status-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #e8f5ef;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="header-badge">
        <span class="dot"></span>
        Revenue Guard · Mock Billing Portal
      </div>
      <h1>Action Received</h1>
      <p>This action has been submitted for processing</p>
    </div>
    <div class="body">
      <div class="status-icon">✓</div>

      <div id="receipt">
        <div class="receipt-row">
          <span class="label">Alert ID</span>
          <span class="value" id="val-alert-id">—</span>
        </div>
        <div class="receipt-row">
          <span class="label">Action</span>
          <span class="value" id="val-action">—</span>
        </div>
        <div class="receipt-row">
          <span class="label">Customer</span>
          <span class="value" id="val-customer">—</span>
        </div>
        <div class="receipt-row">
          <span class="label">Est. Recovery</span>
          <span class="value accent" id="val-recovery">—</span>
        </div>
        <div class="receipt-row">
          <span class="label">Submitted At</span>
          <span class="value" id="val-time">—</span>
        </div>
        <div class="receipt-row">
          <span class="label">Status</span>
          <span class="value">
            <code>submitted</code>
          </span>
        </div>
      </div>
    </div>
    <div class="footer">
      <p>This is a demo billing portal — no real charge has been processed.</p>
      <button class="back-btn" onclick="window.close()">Close</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const alertId = params.get('alert_id') ?? '—';
    const action  = params.get('action')   ?? '—';
    const customer = params.get('customer') ?? '—';
    const recovery = params.get('recovery');

    document.getElementById('val-alert-id').textContent = alertId;
    document.getElementById('val-action').innerHTML = `<code>${action}</code>`;
    document.getElementById('val-customer').textContent = customer;

    if (recovery) {
      const num = parseInt(recovery, 10);
      const formatted = new Intl.NumberFormat('en-IN', {
        style: 'currency', currency: 'INR', maximumFractionDigits: 0
      }).format(num);
      document.getElementById('val-recovery').textContent = formatted;
    }

    document.getElementById('val-time').textContent = new Date().toLocaleString('en-IN', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  </script>
</body>
</html>
